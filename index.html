<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            gesture-detector
        >
            <!-- Marker 1 -->
            <a-marker
                id="marker1"
                type="pattern"
                url="assets/marker1.patt"
                emitevents="true"
            >
                <a-entity id="linked-object1" scale="1 1 1" position="0 0 0">
                    <a-image
                        src="assets/asset.png"
                        rotation="-90 0 0"
                        custom-gesture="id: linked-object1"
                    ></a-image>
                </a-entity>
            </a-marker>

            <!-- Marker 2 -->
            <a-marker
                id="marker2"
                type="pattern"
                url="assets/marker2.patt"
                emitevents="true"
            >
                <a-entity id="linked-object2" scale="1 1 1" position="0 0 0">
                    <a-video 
                        src="#sample-video"
                        width="1.08" 
                        height="1.62"
                        rotation="-90 0 0"
                        custom-gesture="id: linked-object2"
                    ></a-video>
                </a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <!-- Video Element -->
        <video id="sample-video" autoplay loop>
            <source src="assets/sample.mp4" type="video/mp4">
        </video>
    <!-- Play Button --> 
    <button id="play-btn" style="position: absolute; top: 10px; left: 10px;" onclick="document.getElementById('sample-video').play()">Play Video</button>
    </body>

    <script>
        // Independent gesture scaling
        AFRAME.registerComponent('custom-gesture', {
            schema: {
                id: { type: 'string' } // ID of the object to scale
            },
            init: function () {
                const object = document.querySelector(`#${this.data.id}`);
                this.el.addEventListener('gesturechange', (event) => {
                    const scale = event.detail.scale || 1; // Default scale = 1 if undefined
                    object.setAttribute('scale', {
                        x: scale,
                        y: scale,
                        z: scale
                    });
                });
            }
        });

        // Relocate objects dynamically
        AFRAME.registerComponent('relocate-object', {
            tick: function () {
                const marker = this.el; // Marker entity
                if (marker.object3D.visible) {
                    const markerPosition = marker.object3D.position;

                    // Dynamically relocate object based on marker's position
                    const linkedObjectId = this.el.id === 'marker1' ? 'linked-object1' : 'linked-object2';
                    const linkedObject = document.querySelector(`#${linkedObjectId}`);
                    linkedObject.setAttribute('position', {
                        x: markerPosition.x,
                        y: markerPosition.y + 0.5, // Example offset above the marker
                        z: markerPosition.z
                    });
                }
            }
        });
    </script>
</html>
