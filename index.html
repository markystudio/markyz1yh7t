<!doctype html>
<html>
    <head>
        <!-- Include Required Libraries -->
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <!-- A-Frame Scene -->
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            gesture-detector
        >
            <!-- Marker 1 -->
            <a-marker
                id="marker1"
                type="pattern"
                url="assets/marker1.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                scale="2 2 2"
            >
                <a-entity id="linked-object1" scale="2 1.5 1" position="0 0 0">
                    <a-image
                        src="assets/asset.png"
                        rotation="-90 0 0"
                        custom-gesture1
                    ></a-image>
                </a-entity>
            </a-marker>

            <!-- Marker 2 -->
            <a-marker
                id="marker2"
                type="pattern"
                url="assets/marker2.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                scale="2 2 2"
            >
                <a-entity id="linked-object2" scale="2.7 2 2" position="300 0 0">
                    <a-video
                        src="#sample-video"
                        width="1.08"
                        height="1.62"
                        class="clickable"
                        position="0 0 0"
                        rotation="-90 0 0"
                        custom-gesture2
                    ></a-video>
                </a-entity>
            </a-marker>

            <!-- Camera -->
            <a-entity camera></a-entity>
        </a-scene>

        <!-- Video Element -->
        <video id="sample-video" autoplay loop>
            <source src="assets/sample.mp4" type="video/mp4">
        </video>

        <!-- Play Button -->
        <button id="play-btn" style="position: absolute; top: 10px; left: 10px;" onclick="document.getElementById('sample-video').play()">Play Video</button>
    </body>

    <script>
        // Marker 1: Detect events
        document.querySelector('#marker1').addEventListener('markerFound', () => {
            console.log('Marker 1 detected!');
            // Relocate or adjust objects tied to Marker 1
        });

        // Marker 2: Detect events
        document.querySelector('#marker2').addEventListener('markerFound', () => {
            console.log('Marker 2 detected!');
            // Relocate or adjust objects tied to Marker 2
        });

        // Relocate objects dynamically based on Marker 1
        AFRAME.registerComponent('relocate-object', {
            tick: function () {
                const marker = this.el; // Marker entity
                if (marker.object3D.visible) {
                    const markerPosition = marker.object3D.position;
                    console.log('Marker Position:', markerPosition);

                    // Dynamically relocate object tied to Marker 1
                    const linkedObject = document.querySelector('#linked-object1');
                    linkedObject.setAttribute('position', {
                        x: markerPosition.x,
                        y: markerPosition.y + 0.5, // Offset above marker
                        z: markerPosition.z
                    });
                }
            }
        });

        // Relocate objects dynamically based on Marker 2
        AFRAME.registerComponent('relocate-marker2-object', {
            tick: function () {
                const marker = this.el; // Marker 2 entity
                if (marker.object3D.visible) {
                    const markerPosition = marker.object3D.position;

                    // Dynamically relocate object tied to Marker 2
                    const linkedObject = document.querySelector('#linked-object2');
                    linkedObject.setAttribute('position', {
                        x: markerPosition.x,
                        y: markerPosition.y + 0.5, // Offset above marker
                        z: markerPosition.z
                    });
                }
            }
        });

        // Gesture Handling for Marker 1
        AFRAME.registerComponent('custom-gesture1', {
            init: function () {
                this.el.addEventListener('gesturechange', (event) => {
                    const scale = event.detail.scale || 1; // Get scale factor
                    this.el.setAttribute('scale', {
                        x: scale,
                        y: scale,
                        z: scale
                    });
                });
            }
        });

        // Gesture Handling for Marker 2
        AFRAME.registerComponent('custom-gesture2', {
            init: function () {
                this.el.addEventListener('gesturechange', (event) => {
                    const scale = event.detail.scale || 1; // Get scale factor
                    this.el.setAttribute('scale', {
                        x: scale * 1.5, // Example independent scaling factor
                        y: scale * 1.5,
                        z: scale * 1.5
                    });
                });
            }
        });
    </script>
</html>
