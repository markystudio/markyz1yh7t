<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            gesture-detector
        >
            <!-- Marker 1 -->
            <a-marker
                id="marker1"
                type="pattern"
                url="assets/marker1.patt"
                cursor="fuse: false; rayOrigin: mouse;"
                scale="2 2 2"
            >
                <a-entity scale="1.5 1.5 1" position="0 0 0">
                    <a-image
                        src="assets/asset.png"
                        rotation="-90 0 0"
                        gesture-handler
                    ></a-image>
                </a-entity>
            </a-marker>

            <!-- Marker 2 -->
            <a-marker
                id="marker2"
                type="pattern"
                url="assets/marker2.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                scale="2 2 2"
            >
                <a-entity scale="1.5 1 1" position="0 0 0">
                    <a-video 
                        src="#sample-video"
                        width="1.08" 
                        height="1.62"
                        class="clickable"
                        position="0 0 0"
                        rotation="-90 0 0"
                        gesture-handler
                    ></a-video>
                </a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <!-- Video Element -->
        <video id="sample-video" autoplay loop>
            <source src="assets/sample.mp4" type="video/mp4">
        </video>

        <!-- Play Button -->
        <button id="play-btn" style="position: absolute; top: 10px; left: 10px;" onclick="document.getElementById('sample-video').play()">Play Video</button>
    </body>
<script>
document.querySelector('#marker1').addEventListener('markerFound', (event) => {
    console.log('Marker 1 detected!');
    // Relocate or adjust objects here
});
document.querySelector('#marker2').addEventListener('markerFound', () => {
    console.log('Marker 2 detected!');
    // Adjust position for objects tied to Marker 2
});


AFRAME.registerComponent('relocate-object', {
    tick: function () {
        let marker = this.el; // Get the marker entity
        if (marker.object3D.visible) {
            // Access marker's position
            let markerPosition = marker.object3D.position;
            console.log('Marker Position:', markerPosition);

            // Dynamically relocate object tied to this marker
            let linkedObject = document.querySelector('#linked-object');
            linkedObject.setAttribute('position', {
                x: markerPosition.x,
                y: markerPosition.y + 0.5, // Offset above marker
                z: markerPosition.z
            });
        }
    }
});

let marker2 = document.querySelector('#marker2');
let markerPosition2 = marker2.object3D.position;

// Example: Relocate object tied to marker 2
let object2 = document.querySelector('#linked-object2');
object2.setAttribute('position', {
    x: markerPosition2.x + 0.5, // Adjust offset
    y: markerPosition2.y,
    z: markerPosition2.z
});

AFRAME.registerComponent('relocate-marker2-object', {
    tick: function () {
        let marker = this.el; // Marker 2 entity
        if (marker.object3D.visible) {
            let linkedObject = document.querySelector('#linked-object2');
            let markerPosition = marker.object3D.position;

            // Dynamically relocate object based on Marker 2's position
            linkedObject.setAttribute('position', {
                x: markerPosition.x,
                y: markerPosition.y + 0.5,
                z: markerPosition.z
            });
        }
    }
});

</script>
</html>
