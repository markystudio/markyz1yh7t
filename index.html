<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/jeromeetienne/ar.js/aframe/build/aframe-ar.min.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker1.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
                scale="2 2 2" <!-- Adjust scale of the marker -->
            >
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker2.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
                scale="2 2 2" <!-- Adjust scale of the marker -->
            >
                 <a-entity scale="1 1 1">
                <a-image
                    src="assets/asset.png"
                    class="clickable"
                    rotation="-90 0 0"
                    gesture-handler
                ></a-image>
            </a-entity>
         <a-entity scale="1 1 1">
        <a-video 
          src="#sample-video" 
          width="0.9" 
          height="1.6" 
          class="clickable"
          position="0 0.1 1" 
          rotation="-90 0 0"
          gesture-handler
        ></a-video>
                </a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

           <!-- Video Element -->
            <video id="sample-video" autoplay loop>
                <source src="assets/sample.mp4" type="video/mp4">
            </video>
           <button id="play-btn" style="position: absolute; top: 10px; left: 10px;" onclick="document.getElementById('sample-video').play()">Play Video</button>

        
    </body>
</html>
